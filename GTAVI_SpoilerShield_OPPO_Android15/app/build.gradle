plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.spoilershield'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.spoilershield'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1-oppo-android15'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
